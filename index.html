<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Introvert Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Мобильный «бенто»: шапка с неделей, красная карточка ближайшего дела, сетка разделов, стеклянная панель ввода.
     Всегда светлая тема (тему Telegram не берём). Красный и золото — флаг Кыргызстана, солнце с тюндюком — знак офиса. */
  :root{
    --bg:#f2f1ef; --card:#ffffff; --ink:#17120f; --text:#17120f; --hint:#8a817d;
    --line:rgba(23,18,15,.07); --soft:rgba(23,18,15,.045);
    --accent:#c8102e; --accent-2:#8f0a1f; --accent-text:#ffffff; --gold:#efbf45;
    --c-tasks:#c8102e; --c-events:#c98a12; --c-money:#1f8a6b; --c-notes:#2a6fdb;
    --work:#2a6fdb; --family:#1f8a6b; --personal:#c98a12; --danger:#c8102e;
    --radius:24px;
    --shadow:0 1px 1px rgba(23,18,15,.03),0 10px 28px -14px rgba(23,18,15,.16);
    --display:"Geologica","Onest",system-ui,sans-serif;
    --body:"Onest",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:17px/1.45 var(--body);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px calc(124px + env(safe-area-inset-bottom))}
  .view[hidden]{display:none}

  /* ---------- шапка ---------- */
  .head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:4px 0 18px}
  .hd-txt{min-width:0}
  .date{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--hint)}
  h1{font:700 28px/1.15 var(--display);letter-spacing:-.03em;margin:4px 0 0;text-wrap:balance}
  .sunmark{width:46px;height:46px;flex:none;color:var(--gold);filter:drop-shadow(0 6px 12px rgba(200,16,46,.28))}

  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:0 0 14px}
  .wd{border:0;background:var(--card);border-radius:16px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;
    cursor:pointer;box-shadow:0 1px 1px rgba(23,18,15,.03)}
  .wd span{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--hint)}
  .wd b{font:600 17px/1.2 var(--display);font-variant-numeric:tabular-nums}
  .wd i{width:5px;height:5px;border-radius:50%}
  .wd i.dot{background:var(--accent)}
  .wd.past{opacity:.45}
  .wd.on{background:var(--ink);color:#fff}
  .wd.on span{color:rgba(255,255,255,.6)}
  .wd.on i.dot{background:var(--gold)}

  /* ---------- ближайшее дело ---------- */
  .hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 20px 16px;margin:0 0 12px;color:#fff;
    background:radial-gradient(120% 140% at 100% 0%,#e3263f 0%,#b30d27 48%,#7d0919 100%);box-shadow:0 18px 40px -20px rgba(150,10,30,.75)}
  .hero > *:not(.burst){position:relative}
  .burst{position:absolute;right:-96px;top:-96px;width:260px;height:260px;color:var(--gold);opacity:.13;pointer-events:none;animation:spin 140s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75)}
  .h-time{font:700 50px/1 var(--display);letter-spacing:-.04em;margin:12px 0 6px;font-variant-numeric:tabular-nums}
  .h-ttl{font-size:20px;font-weight:600;line-height:1.25;max-width:88%;text-wrap:balance}
  .hero.calm .h-ttl{font:700 24px/1.2 var(--display);letter-spacing:-.02em;margin-top:10px}
  .h-sub{margin-top:8px;color:rgba(255,255,255,.8);font-size:15px;max-width:88%}
  .h-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;
    border-top:1px solid rgba(255,255,255,.18);font-size:14px;color:rgba(255,255,255,.82)}
  .h-btn{border:0;border-radius:999px;padding:10px 18px;background:#fff;color:var(--accent-2);font-weight:600;font-size:15px;cursor:pointer;flex:none}
  .h-btn:active{transform:scale(.96)}

  /* ---------- автоответ ---------- */
  .away{background:var(--card);border-radius:var(--radius);padding:14px 16px;margin:0 0 12px;box-shadow:var(--shadow)}
  .a-head{display:flex;align-items:center;gap:12px;cursor:pointer}
  .a-ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--soft);color:var(--ink)}
  .a-ico svg{width:19px;height:19px}
  .a-txt{flex:1;min-width:0}
  .a-ttl{font-weight:600;font-size:16px}
  .a-sub{font-size:14px;color:var(--hint)}
  .away .chips{margin-top:12px;gap:6px}
  .away .chip{padding:8px 14px;font-size:14px}
  .away.on{color:#fff;background:radial-gradient(130% 160% at 100% 0%,#3a2d27 0%,#1d1613 60%,#120d0b 100%);
    box-shadow:0 16px 34px -18px rgba(23,18,15,.7)}
  .away.on .a-ico{background:rgba(239,191,69,.16);color:var(--gold)}
  .away.on .a-sub{color:rgba(255,255,255,.62)}
  .away.on .chev{color:rgba(255,255,255,.5)}
  .a-quote{margin-top:12px;font-size:15px;line-height:1.4;color:rgba(255,255,255,.88);padding-left:12px;border-left:2px solid var(--gold)}
  .a-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;color:rgba(255,255,255,.7)}
  .a-foot b{color:#fff;font:600 15px var(--display)}
  .a-btn{border:0;border-radius:999px;padding:9px 16px;background:#fff;color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;flex:none}
  .a-btn:active{transform:scale(.96)}

  /* ---------- сетка разделов ---------- */
  .bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{min-width:0;background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .15s ease;--c:var(--accent)}
  .card:active{transform:scale(.98)}
  .card.wide{grid-column:1/-1}
  .card:focus-visible,.wd:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .c-tasks{--c:var(--c-tasks)} .c-events{--c:var(--c-events)} .c-money{--c:var(--c-money)} .c-notes{--c:var(--c-notes)}
  .c-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .c-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--c);
    background:color-mix(in srgb,var(--c) 12%,transparent)}
  .c-ico svg{width:18px;height:18px}
  .c-name{font-weight:600;font-size:16px}
  .c-count{margin-left:auto;font:600 15px var(--display);color:var(--hint);font-variant-numeric:tabular-nums}
  .chev{width:18px;height:18px;color:var(--hint);flex:none}
  .c-name + .chev{margin-left:auto}
  .big-n{font:700 26px/1.1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .big-n small{font:500 15px var(--body);letter-spacing:0;color:var(--hint)}
  .cap2{font-size:14px;color:var(--hint);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .seg{display:flex;gap:3px;height:8px;margin-top:14px}
  .seg i{border-radius:4px;min-width:6px}
  .quote{font-size:17px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .quiet{color:var(--hint);font-size:15px}
  .mini .row{min-height:46px;padding:10px 0;gap:12px}
  .mini .check{width:24px;height:24px}
  .mini .t{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .when{font-size:14px;color:var(--hint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .when.late{color:var(--danger)}

  /* ---------- разделы ---------- */
  .top{display:flex;align-items:center;gap:10px;margin:4px 0 18px}
  .back{border:0;background:var(--card);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:var(--shadow)}
  .back svg{width:20px;height:20px}
  .top h2{font:700 28px/1.15 var(--display);letter-spacing:-.03em;margin:0}
  body.in-tg .back{display:none}  /* в Telegram — системная кнопка «Назад» */

  .group{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--hint);margin:24px 6px 8px}
  .group:first-child{margin-top:0}
  .list{background:var(--card);border-radius:var(--radius);padding:0 16px;box-shadow:var(--shadow)}
  .row{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line);min-height:60px}
  .row:first-child{border-top:0}
  .row .t{flex:1;min-width:0}
  .row .m{font-size:14px;color:var(--hint);margin-top:2px;display:flex;align-items:center;gap:6px}
  .row .m i{width:8px;height:8px;border-radius:50%;display:inline-block}
  .row .late{color:var(--danger)}
  .row .amt{font:600 16px var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}

  .check{width:28px;height:28px;border-radius:50%;border:2px solid color-mix(in srgb,var(--hint) 55%,transparent);
    flex:none;display:grid;place-items:center;cursor:pointer;background:none;padding:0;transition:all .2s ease}
  .check svg{width:14px;height:14px;opacity:0;transition:opacity .2s}
  .row.done .check{background:var(--family);border-color:var(--family)}
  .row.done .check svg{opacity:1}
  .row.done .t{color:var(--hint);text-decoration:line-through}
  .row.gone{opacity:0;transition:opacity .3s}

  .big{background:var(--card);border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow)}
  .big .total{font:700 40px/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .big .total small{font:500 17px var(--body);letter-spacing:0;color:var(--hint);margin-left:6px}
  .big .cap{font-size:15px;color:var(--hint);margin-top:8px}
  .catrow{margin-top:18px}
  .catrow .h{display:flex;justify-content:space-between;font-size:16px}
  .catrow .h b{font:600 16px var(--display);font-variant-numeric:tabular-nums}
  .track{height:8px;border-radius:4px;background:var(--soft);margin-top:8px;overflow:hidden}
  .track div{height:100%;border-radius:4px}

  .day{width:52px;flex:none;text-align:center;border-radius:16px;background:var(--soft);padding:7px 0 6px}
  .day b{display:block;font:700 20px/1.1 var(--display)}
  .day span{font-size:12px;color:var(--hint)}
  .row.today .day{background:var(--accent);color:#fff}
  .row.today .day span{color:rgba(255,255,255,.75)}

  .note{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
  .note .m{font-size:13px;color:var(--hint);margin-top:8px}

  .empty{background:var(--card);border-radius:var(--radius);padding:28px 20px;text-align:center;color:var(--hint);box-shadow:var(--shadow)}
  .empty b{display:block;color:var(--text);font:600 19px var(--display);margin-bottom:6px}

  /* ---------- панель ввода ---------- */
  .add{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:14px 16px calc(14px + env(safe-area-inset-bottom));pointer-events:none;
    background:linear-gradient(to top,var(--bg) 45%,rgba(242,241,239,0))}
  .add form{pointer-events:auto;max-width:528px;margin:0 auto;display:flex;gap:8px;align-items:center;padding:6px 6px 6px 20px;border-radius:32px;
    background:rgba(255,255,255,.84);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
    box-shadow:0 0 0 1px rgba(23,18,15,.06),0 14px 34px -14px rgba(23,18,15,.3)}
  .add input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--text);font:inherit;padding:12px 0}
  .add input::placeholder{color:var(--hint)}
  .add button{width:52px;height:52px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;
    background:linear-gradient(150deg,#e0213c,#9e0c22);box-shadow:0 8px 20px -6px rgba(200,16,46,.6);transition:transform .15s,opacity .2s}
  .add button:active{transform:scale(.94)}
  .add button:disabled{opacity:.4}
  .add button svg{width:24px;height:24px}
  .add .mic, .add.has-text .plus{display:block} .add .plus, .add.has-text .mic{display:none}
  .add.rec button{animation:ring 1.4s ease-out infinite}
  .add.rec input::placeholder{color:var(--danger);font-weight:500}
  .add.busy button{opacity:.55;animation:none}
  @keyframes ring{0%{box-shadow:0 0 0 0 rgba(200,16,46,.45)}100%{box-shadow:0 0 0 18px rgba(200,16,46,0)}}

  .toast{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:528px;margin:0 auto;z-index:11;
    background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;font-size:15px;box-shadow:0 14px 30px -12px rgba(23,18,15,.5);
    opacity:0;transform:translateY(10px);transition:all .25s ease;pointer-events:none}
  .toast.on{opacity:1;transform:none}

  .row .t, .note{cursor:pointer}

  /* ---------- карточка правки ---------- */
  .veil{position:fixed;inset:0;background:rgba(23,18,15,.38);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);
    border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
  .sheet.on{transform:none}
  .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
  .sheet h3{margin:0 0 16px;font:700 22px/1.2 var(--display);letter-spacing:-.02em}
  .fld{display:block;margin-bottom:14px}
  .fld span{display:block;font-size:14px;color:var(--hint);margin:0 0 6px 2px}
  .fld input,.fld textarea{width:100%;border:0;outline:0;background:var(--soft);color:var(--text);font:inherit;
    border-radius:16px;padding:14px;min-height:52px}
  .fld textarea{resize:none;min-height:96px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:0;background:var(--soft);border-radius:999px;padding:10px 16px;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .chip i{width:8px;height:8px;border-radius:50%}
  .chip.on{background:var(--ink);color:#fff}
  .linkbtn{border:0;background:none;color:var(--accent);font-size:15px;padding:4px 2px;cursor:pointer}
  .acts{display:grid;gap:10px;margin-top:20px}
  .btn{height:54px;border:0;border-radius:18px;font-size:17px;font-weight:600;cursor:pointer}
  .btn.main{background:linear-gradient(150deg,#e0213c,#9e0c22);color:#fff}
  .btn.del{background:color-mix(in srgb,var(--danger) 10%,transparent);color:var(--danger)}
  .readonly{font-size:18px;margin-bottom:6px}
  .readonly + .m{color:var(--hint);font-size:15px}

  .sk{border-radius:var(--radius);background:var(--card);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}
  .fade{animation:fade .4s cubic-bezier(.2,.8,.2,1) both}
  .bento .fade:nth-child(2){animation-delay:.04s} .bento .fade:nth-child(3){animation-delay:.08s} .bento .fade:nth-child(4){animation-delay:.12s}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <section class="view" id="v-home">
    <header class="head">
      <div class="hd-txt"><div class="date" id="date"></div><h1 id="hello">&nbsp;</h1></div>
      <svg class="sunmark" id="sunmark" viewBox="0 0 100 100" aria-hidden="true"></svg>
    </header>
    <div class="week" id="week"></div>
    <div id="away"></div>
    <div id="next"></div>
    <div class="bento" id="tiles">
      <div class="sk" style="height:200px;grid-column:1/-1"></div>
      <div class="sk" style="height:140px"></div><div class="sk" style="height:140px"></div>
    </div>
  </section>

  <section class="view" id="v-section" hidden>
    <div class="top">
      <button class="back" onclick="history.back()" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2 id="s-title"></h2>
    </div>
    <div id="s-body"></div>
  </section>

</div>

<div class="add">
  <form id="addForm" autocomplete="off">
    <input id="addInput" placeholder="Скажите или напишите" enterkeyhint="send">
    <button id="addBtn" type="button" aria-label="Сказать голосом">
      <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>
    </button>
  </form>
</div>
<div class="toast" id="toast"></div>
<div class="veil" id="veil" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>

<script>
const tg = window.Telegram?.WebApp;
const IN_TG = !!tg?.initData;
const initData = tg?.initData || "";
const DEMO = true;  // демо-копия: только примеры, без сервера
const $ = id => document.getElementById(id);

// ---------- оформление ----------
// своя светлая палитра при любой теме Telegram: шапку и фон окна красим в цвет страницы
function applyTheme(){
  if(!IN_TG) return;
  const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  try{ tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor?.(bg); }catch(e){}
}
if(tg){ tg.ready(); tg.expand(); applyTheme(); }

// солнце с флага: 40 лучей, кольцо и тюндюк; рисуется currentColor
function sunSVG(id){
  const rays = Array.from({length:40}, (_, i) => `<path d="M50 4L51.7 24.5H48.3Z" transform="rotate(${i*9} 50 50)"/>`).join("");
  return `<g fill="currentColor">${rays}</g><circle cx="50" cy="50" r="19.5" fill="none" stroke="currentColor" stroke-width="6"/>
    <clipPath id="${id}"><circle cx="50" cy="50" r="16.5"/></clipPath>
    <g fill="none" stroke="currentColor" stroke-width="2.2" clip-path="url(#${id})">
      <path d="M32 43Q50 51 68 43M32 50Q50 58 68 50M32 57Q50 65 68 57M43 32Q51 50 43 68M50 32Q58 50 50 68M57 32Q65 50 57 68"/></g>`;
}
$("sunmark").innerHTML = `<circle cx="50" cy="50" r="50" fill="var(--accent)"/>` + sunSVG("tk-mark");
if(IN_TG) document.body.classList.add("in-tg");

// ---------- справочники и форматирование ----------
const CAT = {food:["Еда","#1f8a6b"],transport:["Транспорт","#2a6fdb"],home:["Дом","#c98a12"],family:["Семья","#c8102e"],
  work:["Работа","#5b5bd6"],health:["Здоровье","#8e5bd0"],other:["Прочее","#a39c98"]};
const TCAT = {work:["Работа","var(--work)"],family:["Семья","var(--family)"],personal:["Личное","var(--personal)"]};
const ICON = {
  tasks:  `<path d="M5 12.5l4 4 10-10"/>`,
  events: `<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>`,
  money:  `<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/>`,
  notes:  `<path d="M6 4h9l4 4v12H6z"/><path d="M15 4v4h4M9 13h7M9 17h5"/>`,
};
const CHECK = `<svg viewBox="0 0 12 12" fill="none"><path d="M2.5 6.2l2.3 2.3 4.7-4.9" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const TZ = "Asia/Bishkek";
const fmt = n => Math.round(n).toLocaleString("ru-RU");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, a, b, c) => n%10===1&&n%100!==11 ? a : n%10>=2&&n%10<=4&&(n%100<10||n%100>=20) ? b : c;
const dayKey = d => d.toLocaleDateString("sv-SE", {timeZone:TZ});
const timeStr = d => d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit", timeZone:TZ});
const shortDate = d => d.toLocaleDateString("ru-RU", {day:"numeric", month:"long", timeZone:TZ});
const now = () => new Date();

function when(iso){  // -> {group, text, late}
  const d = new Date(iso), n = now();
  const k = dayKey(d), today = dayKey(n), tmr = dayKey(new Date(n.getTime()+864e5));
  const t = timeStr(d), hasTime = t !== "09:00";
  if(d < n && k !== today) return {group:"late", text: shortDate(d), late:true};
  if(k === today) return {group:"today", text: hasTime ? t : "Сегодня", late: d < n && hasTime};
  if(k === tmr)   return {group:"tomorrow", text: hasTime ? `Завтра, ${t}` : "Завтра"};
  return {group:"later", text: shortDate(d) + (hasTime ? `, ${t}` : "")};
}

  if(!r.ok) throw "http";
  return r.json();
}

function renderWeek(){
  const today = dayKey(now()), base = new Date(today + "T12:00:00Z"), wd = (base.getUTCDay() + 6) % 7;
  const marks = new Set([...DATA.tasks.filter(t => t.due_at).map(t => dayKey(new Date(t.due_at))), ...DATA.events.map(e => e.date)]);
  return ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map((nm, i) => {
    const d = new Date(base.getTime() + (i - wd) * 864e5), k = d.toISOString().slice(0, 10);
    return `<button class="wd ${k===today?"on":""} ${k<today?"past":""}" onclick="go('tasks')" aria-label="${nm} ${d.getUTCDate()}">
      <span>${nm}</span><b>${d.getUTCDate()}</b><i class="${marks.has(k)?"dot":""}"></i></button>`;
  }).join("");
}

function renderHero(){
  const n = now();
  const todays = DATA.tasks.filter(t => t.due_at && when(t.due_at).group === "today");
  const up = todays.filter(t => new Date(t.due_at) >= n && timeStr(new Date(t.due_at)) !== "09:00")
    .sort((a,b) => new Date(a.due_at) - new Date(b.due_at))[0];
  const burst = `<svg class="burst" viewBox="0 0 100 100" aria-hidden="true">${sunSVG("tk-hero")}</svg>`;
  if(!up) return `<div class="hero calm fade">${burst}<div class="eyebrow">Сегодня</div>
    <div class="h-ttl">${todays.length ? `${todays.length} ${plural(todays.length,"дело","дела","дел")} без точного времени` : "По времени больше ничего"}</div>
    <div class="h-sub">Нажмите микрофон и скажите, что запланировать. Запишу и напомню.</div></div>`;
  const mins = Math.max(0, Math.round((new Date(up.due_at) - n) / 6e4));
  const left = mins < 1 ? "сейчас" : mins < 60 ? `через ${mins} мин` : `через ${Math.floor(mins/60)} ч${mins%60 ? ` ${mins%60} мин` : ""}`;
  const rest = todays.length - 1;
  return `<div class="hero fade">${burst}<div class="eyebrow">Дальше по плану · ${left}</div>
    <div class="h-time">${timeStr(new Date(up.due_at))}</div><div class="h-ttl">${esc(up.title)}</div>
    <div class="h-foot"><span>${rest ? `ещё ${rest} ${plural(rest,"дело","дела","дел")} сегодня` : "больше дел на сегодня нет"}</span>
      <button class="h-btn" onclick="heroDone('${up.id}')">Готово</button></div></div>`;
}

const MOON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>`;
const BELL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></svg>`;
const AWAY_PRESETS = [["meeting","Встреча · 1 ч"],["drive","За рулём"],["day","До утра"]];

function untilText(iso){
  if(!iso) return "пока не выключите";
  const d = new Date(iso), k = dayKey(d), n = now();
  return k === dayKey(n) ? `до ${timeStr(d)}` : k === dayKey(new Date(n.getTime()+864e5)) ? `до завтра, ${timeStr(d)}` : `до ${shortDate(d)}`;
}

function renderAway(){
  const a = DATA.away || {on:false};
  if(!a.on) return `<div class="away fade"><div class="a-head" onclick="editAway()"><span class="a-ico">${BELL}</span>
      <div class="a-txt"><div class="a-ttl">Вы на связи</div><div class="a-sub">Заняты — включите автоответ</div></div>${CHEV}</div>
    <div class="chips">${AWAY_PRESETS.map(([k,n]) => `<button class="chip" onclick="setAway({preset:'${k}'})">${n}</button>`).join("")}</div></div>`;
  return `<div class="away on fade"><div class="a-head" onclick="editAway()"><span class="a-ico">${MOON}</span>
      <div class="a-txt"><div class="a-ttl">Не на связи</div><div class="a-sub">${untilText(a.until)} · отвечаю за вас</div></div>${CHEV}</div>
    <div class="a-quote">${esc(a.text)}</div>
    <div class="a-foot"><span>${a.count ? `Пока вас нет: <b>${a.count}</b> ${plural(a.count,"обращение","обращения","обращений")}` : "Пока никто не писал"}</span>
      <button class="a-btn" onclick="setAway({off:true})">Я на связи</button></div></div>`;
}

const AWAY_TEXT = {meeting:"Я на встрече{u}. Отвечу, как освобожусь.", drive:"Я за рулём{u}. Перезвоню, как доберусь.",
  busy:"Сейчас занят{u}. Отвечу позже.", day:"Сегодня я уже не на связи. Отвечу завтра утром."};
function demoAway(b){  // ?demo: то же, что делает сервер
  if(b.off) return {on:false};
  const n = now(), morning = () => { const d = new Date(`${dayKey(n)}T09:00:00+06:00`); return d > n ? d : new Date(d.getTime()+864e5); };
  const until = b.preset === "day" ? morning() : new Date(n.getTime() + (b.minutes || 60) * 6e4);
  const text = b.text || AWAY_TEXT[b.preset].replace("{u}", " " + untilText(until.toISOString()));
  return {on:true, text, until: b.minutes === 0 ? null : until.toISOString(), count:0};
}

  tg?.HapticFeedback?.impactOccurred("medium");
  try{
    if(DEMO){ DATA.away = demoAway(body); if(body.off) toast("Вы на связи. Кто писал — пришлю в чат"); }
    else { DATA.away = await api("/api/status", {method:"POST", body: JSON.stringify(body)});
      if(body.off) toast("Вы на связи. Кто писал — пришлю в чат"); }
    if(!body.off) toast("Автоответ включён — отвечу всем, кто пишет и звонит");
    closeSheet(); route();
  }catch(e){ toast("Не получилось, попробуйте ещё раз"); }

  tasks: ["Задачи", renderTasks], events: ["События", renderEvents],

function renderTasks(){
  if(!DATA.tasks.length) return empty("Всё сделано", "Напишите внизу, например «отчёт бухгалтеру в пятницу».");
  const groups = {late:"Просрочено", today:"Сегодня", tomorrow:"Завтра", later:"Позже", none:"Без срока"};
  const by = {};
  DATA.tasks.forEach(t => { const g = t.due_at ? when(t.due_at).group : "none"; (by[g] ||= []).push(t); });
  return Object.keys(groups).filter(g => by[g]).map(g => `<div class="group">${groups[g]}</div><div class="list">${by[g].map(t => {
    const w = t.due_at ? when(t.due_at) : null; const [cn, cc] = TCAT[t.category];
    const lbl = !w ? "" : (g==="today" || g==="tomorrow") ? (w.text.match(/\d\d:\d\d/)?.[0] || "") : w.text;
    return `<div class="row" data-id="${t.id}"><button class="check" aria-label="Готово" onclick="complete('${t.id}', this)">${CHECK}</button>
      <div class="t" onclick="editTask('${t.id}')">${esc(t.title)}<div class="m"><i style="background:${cc}"></i>${cn}${lbl ? ` · <span class="${w.late?"late":""}">${lbl}</span>` : ""}</div></div></div>`;
  }).join("")}</div>`).join("");
}

function renderEvents(){
  if(!DATA.events.length) return empty("На две недели пусто", "Напишите, например «у Бакыта день рождения 3 марта».");

    const d = new Date(e.date + "T00:00:00");

  }).join("")}</div>`;

function renderMoney(){

// ---------- голос: нажать — говорить, нажать ещё раз — готово ----------
let rec = null, recStop;
async function toggleVoice(){
  if(rec) return rec.stop();
  if(bar.classList.contains("busy")) return;
  if(DEMO){  // демо без сервера: показываем запись, микрофон не трогаем
    rec = {stop(){ clearTimeout(recStop); rec = null; sendVoice(new Blob([new Uint8Array(4000)])); }};
    recStop = setTimeout(() => rec?.stop(), 3000);
    bar.classList.add("rec"); $("addInput").placeholder = "Говорите… нажмите, чтобы закончить";
    return tg?.HapticFeedback?.impactOccurred("medium");
  }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ return toast("Нет доступа к микрофону. Можно отправить голосовое прямо в чат с ботом."); }
  const type = ["audio/webm;codecs=opus","audio/ogg;codecs=opus","audio/mp4"].find(t => window.MediaRecorder?.isTypeSupported?.(t)) || "";
  const chunks = [];
  rec = new MediaRecorder(stream, type ? {mimeType:type} : {});
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => { stream.getTracks().forEach(t => t.stop()); clearTimeout(recStop); rec = null;
    sendVoice(new Blob(chunks, {type: type || "audio/webm"})); };
  rec.start();
  recStop = setTimeout(() => rec?.stop(), 60000);  // не больше минуты
  bar.classList.add("rec"); $("addInput").placeholder = "Говорите… нажмите, чтобы закончить";
  tg?.HapticFeedback?.impactOccurred("medium");
}

async function sendVoice(blob){
  bar.classList.remove("rec"); bar.classList.add("busy"); $("addInput").placeholder = "Распознаю…";
  try{
    if(blob.size < 2000) throw "short";
    if(DEMO){
      await new Promise(r => setTimeout(r, 900));
      const t = new Date(now().getTime() + 864e5);
      DATA.tasks.unshift({id: String(Date.now()), title: "Встреча с юристом", category: "work", due_at: `${dayKey(t)}T10:00:00+06:00`});
      toast("«Завтра в 10 встреча с юристом» — записал, напомню за 15 минут");
    } else {
      const ext = blob.type.includes("mp4") ? "mp4" : blob.type.includes("ogg") ? "ogg" : "webm";
      const r = await api("/api/voice", {method:"POST", body: blob, headers:{"Content-Type": blob.type, "X-Audio-Ext": ext}});
      toast(r.text ? `«${r.text}» — ${r.reply}` : r.reply);
      if(r.text) DATA = await api("/api/summary");
    }
    tg?.HapticFeedback?.notificationOccurred("success"); route();
  }catch(e){ toast(e === "short" ? "Слишком коротко — нажмите и скажите ещё раз" : "Не получилось распознать, попробуйте ещё раз"); }
  bar.classList.remove("busy"); $("addInput").placeholder = "Скажите или напишите";
}

document.addEventListener("visibilitychange", () => { if(!document.hidden && !DEMO && !sheetOpen) load(); });

// ---------- карточка правки ----------
let sheetOpen = false;
function openSheet(html){
  $("sheetBody").innerHTML = html; sheetOpen = true;
  $("veil").classList.add("on"); $("sheet").classList.add("on"); tg?.BackButton?.show();
}
function closeSheet(){
  sheetOpen = false; $("veil").classList.remove("on"); $("sheet").classList.remove("on");
  if(!SECTIONS[location.hash.slice(1)]) tg?.BackButton?.hide();
}
function chips(id){
  $(id).onclick = e => { const b = e.target.closest(".chip"); if(!b) return;
    [...$(id).children].forEach(x => x.classList.toggle("on", x===b)); tg?.HapticFeedback?.selectionChanged(); };
  return () => $(id).querySelector(".on")?.dataset.k;
}
const ask = text => Promise.resolve(true) || IN_TG && tg.showConfirm ? new Promise(r => tg.showConfirm(text, r)) : Promise.resolve(confirm(text));

async function mutate(path, method, body, local, done){
  try{
    if(DEMO) local();
    else { await api(path, {method, body: body ? JSON.stringify(body) : undefined}); DATA = await api("/api/summary"); }
    closeSheet(); route(); tg?.HapticFeedback?.notificationOccurred("success"); if(done) toast(done);
  }catch(e){ toast("Не получилось, попробуйте ещё раз"); }
}
const delBtn = (table, id, what, local) => async () => {
  if(!(await ask(`Удалить ${what}?`))) return;
  mutate(`/api/${table}/${id}`, "DELETE", null, local, "Удалено");
};

function editTask(id){
  const t = DATA.tasks.find(x => x.id === id); if(!t) return;
  const d = t.due_at ? new Date(t.due_at) : null;
  const dv = d ? dayKey(d) : "", tv = d && timeStr(d) !== "09:00" ? timeStr(d) : "";
  openSheet(`<h3>Задача</h3>
    <label class="fld"><span>Что сделать</span><textarea id="fTitle" rows="2">${esc(t.title)}</textarea></label>
    <div class="two"><label class="fld"><span>Дата</span><input id="fDate" type="date" value="${dv}"></label>
      <label class="fld"><span>Время</span><input id="fTime" type="time" value="${tv}"></label></div>
    <button class="linkbtn" onclick="$('fDate').value='';$('fTime').value=''">Убрать срок</button>
    <div class="fld" style="margin-top:14px"><span>Раздел</span><div class="chips" id="fCat">${Object.entries(TCAT).map(([k,[n,c]]) =>
      `<button class="chip ${k===t.category?"on":""}" data-k="${k}"><i style="background:${c}"></i>${n}</button>`).join("")}</div></div>
    <div class="acts"><button class="btn main" id="fSave">Сохранить</button><button class="btn del" id="fDel">Удалить задачу</button></div>`);
  const cat = chips("fCat");
  $("fSave").onclick = () => {
    const title = $("fTitle").value.trim(); if(!title) return toast("Напишите, что сделать");
    const day = $("fDate").value, time = $("fTime").value;
    const due = day ? `${day}T${time || "09:00"}:00+06:00` : time ? `${dayKey(now())}T${time}:00+06:00` : null;
    const category = cat() || t.category;
    mutate(`/api/tasks/${id}`, "PATCH", {title, category, due_at: due},
      () => Object.assign(t, {title, category, due_at: due ? new Date(due).toISOString() : null}), "Сохранено");
  };
  $("fDel").onclick = delBtn("tasks", id, "задачу", () => DATA.tasks = DATA.tasks.filter(x => x.id !== id));
}

function editExpense(id){
  const r = DATA.expenses.recent.find(x => x.id === id); if(!r) return;
  openSheet(`<h3>Трата</h3>
    <div class="two"><label class="fld"><span>Сумма, сом</span><input id="fAmt" type="number" inputmode="decimal" min="1" value="${Math.round(r.amount)}"></label>
      <label class="fld"><span>Где</span><input id="fMer" value="${esc(r.merchant || "")}" placeholder="Магазин"></label></div>
    <div class="fld"><span>Категория</span><div class="chips" id="fCat">${Object.entries(CAT).map(([k,[n,c]]) =>
      `<button class="chip ${k===r.category?"on":""}" data-k="${k}"><i style="background:${c}"></i>${n}</button>`).join("")}</div></div>
    <div class="acts"><button class="btn main" id="fSave">Сохранить</button><button class="btn del" id="fDel">Удалить трату</button></div>`);
  const cat = chips("fCat");
  const shift = (cat_, amount) => {  // демо: пересчитать итоги без сервера
    const x = DATA.expenses; x.by_category[cat_] = (x.by_category[cat_] || 0) + amount; x.total += amount;
    if(x.by_category[cat_] <= 0) delete x.by_category[cat_];
  };
  $("fSave").onclick = () => {
    const amount = parseFloat($("fAmt").value); if(!(amount > 0)) return toast("Укажите сумму");
    const category = cat() || r.category, merchant = $("fMer").value.trim();
    mutate(`/api/expenses/${id}`, "PATCH", {amount, category, merchant},
      () => { shift(r.category, -r.amount); shift(category, amount); Object.assign(r, {amount, category, merchant}); }, "Сохранено");
  };
  $("fDel").onclick = delBtn("expenses", id, "трату", () => { shift(r.category, -r.amount); DATA.expenses.recent = DATA.expenses.recent.filter(x => x.id !== id); });
}

function editEvent(id){
  const e = DATA.events.find(x => x.id === id); if(!e) return;
  openSheet(`<h3>Событие</h3><div class="readonly">${esc(e.title)}</div>
    <div class="m">${new Date(e.date + "T00:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long"})}${e.kind==="birthday"||e.kind==="holiday" ? " · каждый год" : ""}</div>
    <div class="acts"><button class="btn del" id="fDel">Удалить событие</button></div>`);
  $("fDel").onclick = delBtn("events", id, "событие", () => DATA.events = DATA.events.filter(x => x.id !== id));
}

function editNote(id){
  const n = DATA.notes.find(x => x.id === id); if(!n) return;
  openSheet(`<h3>Заметка</h3><div class="readonly">${esc(n.text)}</div><div class="m">${shortDate(new Date(n.created_at))}</div>
    <div class="acts"><button class="btn del" id="fDel">Удалить заметку</button></div>`);
  $("fDel").onclick = delBtn("notes", id, "заметку", () => DATA.notes = DATA.notes.filter(x => x.id !== id));
}
